<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker - Premium Dark</title>
    <!-- Mantenemos style.css pero ahora tiene diseño oscuro -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA LOGIN: Se adapta automáticamente con clases genéricas oscuras -->
        <div id="login-screen" class="screen active">
            <div class="dark-card text-center">
                <h2>Bienvenido</h2>
                <input type="text" id="username" placeholder="Nombre de usuario" class="dark-input">
                <input type="password" id="password" placeholder="Contraseña" class="dark-input">
                <button onclick="login()" class="main-btn">Iniciar Sesión / Registrarse</button>
            </div>
        </div>

        <!-- PANTALLA PRINCIPAL (HOME): ESTA ES LA QUE HEMOS REDISEÑADO -->
        <div id="main-screen" class="screen">
            <!-- Cabecera estilo image_0.png: Saludo a la izquierda, Avatar a la derecha -->
            <div class="main-header">
                <div class="greeting-container">
                    <span class="current-date" id="current-date-display">martes, 1 abr</span> <!-- Se llena con JS -->
                    <h2 id="greeting">Hola, Usuario</h2>
                </div>
                <!-- Avatar genérico (puedes poner imagen luego) -->
                <div class="user-avatar" id="user-avatar-initials">U</div>
            </div>
            
            <!-- Tarjeta de Semanas Ejercitándose -->
            <div class="dark-card">
                <h3>Semanas Ejercitándose</h3>
                <div class="progress-stats-container">
                    <div id="weekly-stats-text">
                        <span id="weekly-stats-number">0</span> 
                        <span id="weekly-stats-total">SEMANAS SEGUIDAS</span>
                    </div>
                    <div class="weekly-bar-container">
                        <div class="progress-bar" id="weekly-progress"></div>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de Próximos -->
            <div class="dark-card">
                <h3>Próximos Entrenamientos</h3>
                <ul id="upcoming-workouts" class="workout-list">
                    <!-- Los ítems se llenan con JS pero usarán el estilo oscuro -->
                </ul>
                <button onclick="navigate('generate-screen')" class="main-btn mt-2">
                    <i>+</i> Crear Entrenamiento
                </button>
            </div>
            <!-- Botón de cerrar sesión, más discreto al final -->
            <button onclick="logout()" class="main-btn mt-2 danger">Cerrar Sesión</button>
        </div>

        <!-- OTRAS PANTALLAS: Se actualizan los nombres de clase para usar los nuevos estilos oscuros -->
        <div id="generate-screen" class="screen">
            <h2>Nuevo Entrenamiento</h2>
            
            <input type="date" id="workout-date" class="dark-input">
            <input type="time" id="workout-time" class="dark-input">
            
            <div class="split-view">
                <div class="dark-card half">
                    <h3>Catálogo</h3>
                    <ul id="exercise-catalog" class="exercise-list"></ul>
                </div>
                <div class="dark-card half">
                    <h3>Tu Rutina (Arrastra)</h3>
                    <ul id="selected-exercises" class="exercise-list" ondragover="allowDrop(event)" ondrop="drop(event)"></ul>
                </div>
            </div>
            
            <div class="btn-group">
                <button onclick="saveWorkout()" class="main-btn">Guardar</button>
                <button onclick="navigate('main-screen')" class="main-btn secondary">Cancelar</button>
            </div>
        </div>

        <div id="daily-screen" class="screen">
            <div class="header-flex">
                <h2 id="daily-title">Entrenamiento</h2>
                <div class="circular-progress" id="daily-progress-circle">
                    <span id="daily-progress-text">0%</span>
                </div>
            </div>

            <div id="daily-exercise-list" class="daily-cards-container"></div>
            
            <div class="btn-group mt-2">
                <button onclick="navigate('main-screen')" class="main-btn secondary">Volver</button>
                <button onclick="editWorkout()" class="main-btn danger">Editar</button>
            </div>
        </div>

        <div id="exercise-screen" class="screen">
            <h2 id="detail-title">Ejercicio</h2>
            
            <div class="dark-card" id="input-container"></div>
            
            <button onclick="logExerciseData()" class="main-btn mt-2">Registrar Datos</button>

            <div class="dark-card mt-2">
                <h3>Progreso Histórico</h3>
                <canvas id="progressChart"></canvas>
            </div>

            <button onclick="navigate('daily-screen')" class="main-btn mt-2 secondary">Volver al Día</button>
        </div>

    </div>
    <!-- Mantenemos app.js pero haremos pequeños ajustes -->
    <script src="app.js"></script>
</body>
</html>
